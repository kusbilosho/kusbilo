name: gaonhaat
description: GaonHaat — Aapke gaon ka bazaar, ab app mein.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_app_check: ^0.4.5
  cloud_firestore: ^6.7.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21    

  # Cloud Functions — needed for the admin KYC approve/reject calls and
  # order placement/assignment.
  cloud_functions: ^6.3.5
  flutter_local_notifications: ^18.0.0
  # Product photos + push notifications for new orders — both needed
  # for the merchant listing/order-routing features.
  firebase_storage: ^13.4.5
  image_picker: ^1.1.2
  firebase_messaging: ^16.4.3

  # Support contact links (phone/WhatsApp/email) and the "Rate the App"
  # Play Store link.
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

  # Real-time voice conversation — Gemini Live API via Firebase AI
  # Logic. This replaces the old record→transcribe→ask→synthesize→play
  # pipeline with one continuous streaming connection: much lower
  # latency, natural pauses, and the buyer can interrupt mid-reply,
  # like an actual phone call. Live API understands and speaks audio
  # natively, so there's no separate speech-to-text or text-to-speech
  # package needed anymore.
  #
  # NOTE (upgraded): bumped to the versions that match live_voice_service.dart's
  # current API usage (modelTurn/functionCalls/InlineDataPart.data on
  # LiveServerResponse, SoundHandle-based stop() on flutter_soloud, and the
  # record_platform_interface method signatures record_linux 0.7.2 didn't
  # implement).
  firebase_ai: ^3.14.1
  record: ^6.2.1
  flutter_soloud: ^3.5.4

  # Location auto-detect — geolocator reads GPS (free, OS-level),
  # geocoding turns coordinates into a village/district address using
  # the OS's own geocoder (also free, no API key needed).
  geolocator: ^13.0.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/gaonhaat_logo.png
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1F5F3F"
  adaptive_icon_foreground: "assets/icon/icon.png"
