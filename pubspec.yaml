name: kusbilo
description: Kusbilo — Aapke gaon ka bazaar, ab app mein.
publish_to: "none"
version: 0.1.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21    

  # Cloud Functions — needed for the admin KYC approve/reject calls and
  # order placement/assignment.
  cloud_functions: ^6.3.5
  flutter_local_notifications: ^18.0.0
  # Product photos + push notifications for new orders — both needed
  # for the merchant listing/order-routing features.
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  # Persists every downloaded product/category photo to disk so it's
  # only ever fetched over the network once — without this, plain
  # Image.network re-downloads the same photo from scratch basically
  # every time its widget remounts (reopening a product, scrolling a
  # list back into view, restarting the app), which is a real data-cost
  # problem for buyers on limited mobile data, given these photos change
  # rarely if ever.
  cached_network_image: ^3.4.1

  # Support contact links (phone/WhatsApp/email) and the "Rate the App"
  # Play Store link.
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  # Persists tiny local flags across app restarts (e.g. "has the user
  # seen/tried the live-call mic feature yet") — no Firestore round trip
  # needed for something this small and per-device.
  shared_preferences: ^2.3.2

  # Real-time voice conversation — Gemini Live API over a direct
  # WebSocket (same protocol DevMate AI uses). The API key is set once
  # in the web admin panel and read from Firestore
  # (config/geminiLiveApi.apiKey) — buyers never see or enter a key.
  livekit_client: ^2.4.5

  # Location auto-detect — geolocator reads GPS (free, OS-level),
  # geocoding turns coordinates into a village/district address using
  # the OS's own geocoder (also free, no API key needed).
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  shimmer: ^3.0.0

  # UPI payment gateway — calling our own Render-hosted collection
  # server (see upi-payment-gateway) and generating a unique per-order
  # ID for it to match against.
  http: ^1.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/kusbilo_logo.png
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1F5F3F"
  adaptive_icon_foreground: "assets/icon/icon.png"
