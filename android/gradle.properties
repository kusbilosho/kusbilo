# Corrected lower-case 'org' and realistic memory for GitHub Actions runner
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Disable Daemon, Parallel, and VFS Watch to prevent CI/CD freezing
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false

# Standard AndroidX settings
android.useAndroidX=true
android.enableJetifier=true
