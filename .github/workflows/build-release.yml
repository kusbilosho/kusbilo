name: Build Release APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This is the actual fix for the slow/cancelled build: it caches
      # ~/.gradle/caches and the Gradle wrapper between runs, so Gradle
      # doesn't have to re-download and re-resolve every dependency
      # (geolocator_android, image_picker_android, etc.) from scratch
      # every single push. First run after adding this is still slow
      # (nothing cached yet) — every run after that should be much faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Recreates android/key.properties from GitHub Secrets before the
      # build — this file is gitignored (contains the keystore password)
      # so it never lives in the repo, but the signed release build
      # still needs it locally on the CI runner.
      - name: Set up signing config
        run: |
          echo "storeFile=my-release-key.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaonhaat-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # Play Store needs an .aab (App Bundle), not an .apk, for
      # production uploads — this is the file you'll actually submit
      # in Play Console.
      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload App Bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusbilo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
